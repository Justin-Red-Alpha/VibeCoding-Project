<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Price Drop Decision Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ '/' if user else '/discover' }}">📉 Price Drop Decision Tracker</a>
        <nav class="topbar-actions">
            <a class="nav-link" href="/discover">Find deals</a>
            {% if user %}
                <a class="nav-link" href="/">My products</a>
                {% if is_admin %}<a class="nav-link" href="/admin">Admin</a>{% endif %}
                <form method="post" action="/settings/currency" class="currency-form">
                    <label for="cur" class="currency-label">Prices in</label>
                    <select name="currency" id="cur" onchange="this.form.submit()" title="Show prices in">
                        <option value="">As quoted</option>
                        {% for c in fx_currencies %}
                            <option value="{{ c }}" {{ 'selected' if display_pref == c }}>{{ c }}</option>
                        {% endfor %}
                    </select>
                    <input type="hidden" name="next_url" value="{{ request.url.path }}{{ '?' ~ request.url.query if request.url.query else '' }}">
                </form>
                <form method="post" action="/logout" class="account-form">
                    <span class="signed-in-as" title="Signed in">
                        {{ user.username }}{% if is_admin %} <span class="role-tag">admin</span>{% endif %}
                    </span>
                    <button type="submit" class="btn-link">Sign out</button>
                </form>
            {% else %}
                <a class="btn btn-secondary" href="/login?next={{ (request.url.path ~ ('?' ~ request.url.query if request.url.query else ''))|urlencode }}">Log in</a>
                <a class="btn btn-primary" href="/register">Register</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
