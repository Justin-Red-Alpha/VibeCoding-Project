{# A target amount and the currency it's in. Defaults to the currency prices are
   being shown in, since that's the figure the user is reading off the page. #}
<div class="target-field">
    <input type="number" step="0.01" name="target_price" placeholder="Target price (optional)">
    <select name="target_currency" aria-label="Target price currency">
        <option value="">Shop's currency</option>
        {% for c in fx_currencies %}
            <option value="{{ c }}" {{ 'selected' if display_pref == c }}>{{ c }}</option>
        {% endfor %}
    </select>
</div>
