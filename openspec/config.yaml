schema: spec-driven

# Injected into every OpenSpec artifact prompt (supercharge references/openspec.md §3).
context: |
  Architecture method: FRAMEWORK.md (Dat / Trn / Loc / Trm + §4.5 coherence laws),
  from the supercharge skill. The model of this system lives in docs/: start at
  docs/architecture-map.md, then docs/<component>/ARCHITECTURE.md for the
  component(s) touched. Components: discovery, extraction, browser, storage,
  analysis, fx, web, refresh.
  Every claim must name its object, morphism, location or transmission and map to a
  real file:symbol, a planned item, or an explicit open question. Never invent
  architecture that cannot be grounded.
  The eight invariants in CLAUDE.md are non-negotiable (never store a converted
  price; never show a list price; a block never looks like an empty result; never
  rank across currencies; target and history share a currency; the user confirms
  matches; the headline comes only from plausible listings; table rebuilds need
  both pragmas).

rules:
  design:
    - State the model delta as objects and morphisms with signature, partiality, semantics
    - Run the §3 Consolidation check — is this a new object, or an existing object plus morphisms?
    - Name the §4.5 coherence laws the change must keep satisfied
    - Isolate effects behind ports; deduce rather than store; one source of truth for shared structure
  specs:
    - Observable, consumer-facing behaviour only — no internal class or function names
    - Every requirement carries at least one happy-path and one failure Scenario
  tasks:
    - Every new or changed morphism gets a row in docs/<component>/IMPLEMENTATION.md with its file:symbol
    - Reconcile ARCHITECTURE.md, IMPLEMENTATION.md and STATUS.md before archiving
    - Run the supercharge drift check (bash ~/.claude/skills/supercharge/scripts/drift-check.sh) and fix dead rows before archiving

# specs/ vs ARCHITECTURE.md (supercharge references/openspec.md §4): option B.
# openspec/specs/ holds observable, consumer-facing behaviour (pages, forms, the
# SSE stream, verdicts); docs/<component>/ARCHITECTURE.md holds internal objects,
# morphisms and laws. Each spec Scenario doubles as an enumerated test.
